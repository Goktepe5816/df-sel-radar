name: sel-radar
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: radar
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp
      - run: python sel_radar.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: durumu kaydet
        run: |
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add gorulen_sel.json
          git diff --cached --quiet || (git commit -q -m "durum" && git push -q)
