name: sel-radar
# Kendi kendini çalıştıran döngü: 15 dakikada bir tarar, ~5,5 saat sonra kendini yeniden başlatır.
# GitHub'ın schedule'ı sadece yedek (döngü bir şekilde düşerse yeniden başlatır).
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp
      - name: 15 dakikada bir tara (22 tur)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          for i in $(seq 1 22); do
            bas=$(date +%s)
            python sel_radar.py || echo "tur $i hata"
            git add gorulen_sel.json
            if ! git diff --cached --quiet; then
              git commit -q -m "durum" && (git pull -q --rebase && git push -q || echo "push hata")
            fi
            if [ $i -lt 22 ]; then k=$(( 900 - ( $(date +%s) - bas ) )); [ $k -gt 0 ] && sleep $k; fi; true
          done
      - name: kendini yeniden başlat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml -R ${{ github.repository }}
